[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-fatimporter"
version = "0.1.0"
description = "Alliance Auth plugin for tracking corp member FAT imports, corp roles, and ISK payout logic"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["aa_fatimporter*"]

[tool.setuptools.package-data]
aa_fatimporter = [
    "templates/aa_fatimporter/*.html"
]